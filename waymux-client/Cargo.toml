[package]
name = "waymux-client"
description = "Core client logic for the Waymux Android app: WFP frame decoding, WIP input serialization, and the Unix-socket transport."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The JNI cdylib + wgpu renderer are compiled only for Android targets (see the
# `[target.'cfg(target_os = "android")']` section below and the `android`/
# `renderer` modules). The rest of the crate is pure Rust and host-testable.

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
waymux-proto = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
ruzstd = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Android-only: JNI bindings, GPU rendering, native window, logcat sink.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
wgpu = { workspace = true }
ndk = { workspace = true, features = ["api-level-29"] }
raw-window-handle = { workspace = true }
tracing-android = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# Used only to build compressed test fixtures; the client decodes with ruzstd.
zstd = { workspace = true }
